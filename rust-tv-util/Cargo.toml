[package]
name = "tv-util"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
aes = "0.8"
cipher = "0.4"
aes-gcm = { version = "0.10", default-features = false }
base64 = "0.21"
hex = "0.4"
jni = { version = "0.21.1", default-features = false, features = ["invocation"] }
md5 = "0.7"
once_cell = "1.19"
parking_lot = "0.12"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.7", features = ["v4"] }
